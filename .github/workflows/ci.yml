name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Afhankelijkheden installeren
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker-image bouwen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bedrijfsdashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starten en gezondheid controleren
        run: |
          mkdir -p /tmp/data && sudo chown 568:568 /tmp/data
          docker run -d --name bd -p 8080:8080 -v /tmp/data:/data bedrijfsdashboard:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/gezondheid && exit 0
            sleep 1
          done
          docker logs bd
          exit 1
