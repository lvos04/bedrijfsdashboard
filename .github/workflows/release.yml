name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lvos04/bedrijfsdashboard

jobs:
  publiceren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint en tests
        run: |
          pip install -r requirements-dev.txt
          ruff check .
          ruff format --check .
          pytest
      - name: Versie bepalen
        id: versie
        run: echo "versie=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Aanmelden bij GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags en labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Automatische 'latest' (via semver) alleen bij versietags, zoals voorheen; nooit bij workflow_dispatch.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && 'auto' || 'false' }}
          # 'latest' alleen vanaf de standaardbranch (main) en bij versietags, zoals voorheen.
          # Handmatig starten (workflow_dispatch) vanaf een andere branch levert alleen
          # <versie>-rc, branch-<naam> en sha-<kort> op, nooit 'latest'.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.versie.outputs.versie }}-rc,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch }}
            type=sha,prefix=sha-
      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
