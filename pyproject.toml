[project]
name = "bedrijfsdashboard"
version = "0.2.1"
description = "Bedrijfsdashboard: één overzicht van alle bedrijfsapps via de Bedrijfskoppeling API v1"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # regellengte bewaakt ruff format
