[project]
name = "bedrijfsdashboard"
version = "0.1.0"
description = "Bedrijfsdashboard: één overzicht van alle bedrijfsapps via de Bedrijfskoppeling API v1"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
